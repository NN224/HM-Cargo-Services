# Railway build/run for the Laravel + Filament admin panel.
#
# Railway injects a dynamic $PORT; the app must bind to it. Migrations and
# asset/optimisation caching run at start so a fresh deploy is ready without a
# manual step — the same reason the seeder refuses to invent an admin credential
# rather than guess one.

[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo_pgsql", "php84Extensions.pgsql", "php84Extensions.bcmath", "php84Extensions.mbstring", "php84Extensions.intl", "php84Extensions.zip", "composerEnv"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[start]
# Publish Filament assets, cache config/routes, migrate, then serve on $PORT.
# --force is required: migrate refuses to run in production without it.
cmd = "php artisan filament:assets && php artisan optimize && php artisan migrate --force && php artisan serve --host 0.0.0.0 --port ${PORT:-8080}"
